launch:
  - node:
      pkg: my_py_pkg
      exec: number_publisher
      name: num_pub1
      namespace: abc
      param:
        - from: $(find-pkg-share my_py_pkg)/config/number_params.yaml

  - node:
      pkg: my_py_pkg
      exec: number_publisher
      name: num_pub2
      namespace: abc
      param:
        - name: initial_number
          value: 5
        - name: number_timer_period
          value: 0.5
        - name: hardware_timer_period
          value: 1.0

  - node:
      pkg: my_py_pkg
      exec: number_counter
      name: number_counter
      namespace: abc
